name: Development simulator images
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      report:
        description: 'Exact base matrix release tag; empty discovers completed base matrices'
        default: ''
        type: string
      cells:
        description: 'Comma-separated cell keys; empty selects the full matrix'
        default: ''
        type: string
  push:
    branches: [main]
    paths: ['dev/**', '.github/workflows/dev-images.yaml']
  pull_request:
permissions:
  contents: read
concurrency:
  group: development-simulator-images
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s dev -p 'test_*.py'
  plan:
    permissions:
      contents: write
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      report: ${{ steps.plan.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REPORT: ${{ inputs.report }}
          INPUT_CELLS: ${{ inputs.cells }}
        run: python3 dev/pipeline.py plan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: plan
          path: work/dev-plan.json
          retention-days: 30
  image:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: plan
          path: work
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Release disk space for toolkit installation
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Assemble, qualify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          CELL_KEY: ${{ matrix.key }}
        run: |
          set -o pipefail
          python3 dev/pipeline.py build 2>&1 | tee work/build.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: result-${{ matrix.key }}
          path: |
            work/dev-result.json
            work/build.log
            work/*/result-*.json
            work/*/output.log
            work/collection/evidence.json
            work/suite.json
            work/shards/*/evidence.json
            work/shards/*/junit.xml
            work/shards/*/output.log
          if-no-files-found: warn
          retention-days: 30
  report:
    needs: [plan, image]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.report == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: plan
          path: work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.plan.outputs.count != '0'
        with:
          pattern: result-*
          path: results
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish manifests and durable matrix report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 dev/pipeline.py finish
