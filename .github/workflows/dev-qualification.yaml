name: Full AscTile qualification
on:
  workflow_run:
    workflows: [Development simulator images]
    types: [completed]
  schedule:
    - cron: '57 * * * *'
  workflow_dispatch:
    inputs:
      report:
        description: 'Exact base matrix release tag; empty discovers completed base matrices'
        default: ''
        type: string
      cells:
        description: 'Comma-separated cell keys; empty selects the full matrix'
        default: ''
        type: string
      max_modules:
        description: 'Maximum newly executed modules per cell; 0 resumes all within the time budget'
        default: '0'
        type: string
      budget_minutes:
        description: 'Per-cell batch budget (1–300 minutes); unfinished work resumes later'
        default: '240'
        type: string
      retry_blocked:
        description: 'Retry diagnosed resource blockers after addressing the constraint'
        default: false
        type: boolean
env:
  DEV_MODE: qualify
  DEV_MAX_MODULES: ${{ inputs.max_modules || '0' }}
  DEV_BUDGET_MINUTES: ${{ inputs.budget_minutes || '240' }}
  DEV_RETRY_BLOCKED: ${{ inputs.retry_blocked || false }}
permissions:
  contents: read
concurrency:
  group: full-asctile-qualification
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s dev -p 'test_*.py'
  plan:
    permissions:
      contents: write
    needs: tests
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      report: ${{ steps.plan.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REPORT: ${{ inputs.report }}
          INPUT_CELLS: ${{ inputs.cells }}
        run: |
          python3 dev/releases.py
          python3 dev/pipeline.py plan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: plan
          path: work/dev-plan.json
          retention-days: 30
  image:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: plan
          path: work
      - name: Release disk space for toolkit installation
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Run full suite against published image digest
        env:
          GH_TOKEN: ${{ github.token }}
          CELL_KEY: ${{ matrix.key }}
        run: |
          set -o pipefail
          python3 dev/pipeline.py build 2>&1 | tee work/build.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: result-${{ matrix.key }}
          path: |
            work/dev-result.json
            work/build.log
            work/*/result-*.json
            work/*/output.log
            work/collection/evidence.json
            work/suite.json
            work/shards/*/evidence.json
            work/shards/*/junit.xml
            work/shards/*/output.log
            work/shards/*/container-state.json
            work/progress.json
          if-no-files-found: warn
          retention-days: 30
  report:
    needs: [plan, image]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.report == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: plan
          path: work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.plan.outputs.count != '0'
        with:
          pattern: result-*
          path: results
      - name: Publish full-suite qualification report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 dev/pipeline.py finish
      - name: Preserve the stable base report pointer
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 dev/releases.py
